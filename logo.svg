text_only_svg = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E222A"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>

    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE485"/>
      <stop offset="25%" stop-color="#E5B242"/>
      <stop offset="50%" stop-color="#9E711A"/>
      <stop offset="75%" stop-color="#FAD46B"/>
      <stop offset="100%" stop-color="#B58328"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="url(#bg)"/>

  <!-- TYPOGRAPHY ONLY -->
  <g id="typography" filter="url(#shadow)">
    <!-- MAHENDER -->
    <text x="500" y="190" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
          font-size="76" 
          font-weight="700" 
          letter-spacing="16" 
          text-anchor="middle" 
          fill="url(#gold)">
      MAHENDER
    </text>

    <!-- JEWELLERS -->
    <text x="500" y="270" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="32" 
          font-weight="400" 
          letter-spacing="22" 
          text-anchor="middle" 
          fill="url(#gold)">
      JEWELLERS
    </text>

    <!-- ELEGANT MINIMALIST DIVIDER -->
    <g transform="translate(500, 315)" stroke="url(#gold)" fill="none" stroke-width="2.5" stroke-linecap="round">
      <path d="M -140 0 C -90 -16 -40 16 0 0 C 40 16 90 -16 140 0"/>
      <circle cx="0" cy="0" r="4.5" fill="url(#gold)" stroke="none"/>
      <circle cx="-150" cy="0" r="3" fill="url(#gold)" stroke="none"/>
      <circle cx="150" cy="0" r="3" fill="url(#gold)" stroke="none"/>
    </g>
  </g>
</svg>
